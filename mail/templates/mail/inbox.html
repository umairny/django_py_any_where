{% extends "mail/layout.html" %}
{% load static %}

{% block mail_content %}
<div class="mail-nav-container">
    <button class="mail-nav-btn active" id="inbox">
        <i class="fas fa-inbox"></i> Inbox
    </button>
    <button class="mail-nav-btn" id="compose">
        <i class="fas fa-edit"></i> Compose
    </button>
    <button class="mail-nav-btn" id="sent">
        <i class="fas fa-paper-plane"></i> Sent
    </button>
    <button class="mail-nav-btn" id="archived">
        <i class="fas fa-archive"></i> Archived
    </button>
    <form action="{% url 'logout' %}?next={% url 'mail:index' %}" method="POST" id="logout-form-mail" class="m-0 p-0">
        {% csrf_token %}
        <button type="submit" class="mail-nav-btn text-danger" style="border: none; background: none;">
            <i class="fas fa-sign-out-alt"></i>
        </button>
    </form>
</div>

<div id="emails-view" class="fade-in"></div>
<div id="email" class="fade-in" style="display: none;"></div>

<div id="compose-view" class="fade-in" style="display: none;">
    <div class="glass-panel compose-card">
        <div class="mb-4">
            <h3 class="mb-1">New Message</h3>
            <p class="text-muted small">Compose and send your email</p>
        </div>

        <form id="compose-form">
            <div class="form-field">
                <label>From</label>
                <input disabled class="mail-input bg-light" value="{{ request.user.email }}">
            </div>
            <div class="form-field">
                <label for="compose-recipients">Recipients</label>
                <input id="compose-recipients" class="mail-input" placeholder="example@mail.com">
            </div>
            <div class="form-field">
                <label for="compose-subject">Subject</label>
                <input id="compose-subject" class="mail-input" placeholder="Subject">
            </div>
            <div class="form-field">
                <label for="compose-body">Message</label>
                <textarea id="compose-body" class="mail-input mail-textarea"
                    placeholder="Type your message..."></textarea>
            </div>

            <div class="text-right">
                <button type="submit" class="btn-mail-primary px-5">
                    <i class="fas fa-paper-plane mr-2"></i> Send Message
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}

{% block script %}
{{ block.super }}
<script src="{% static 'mail/inbox.js' %}"></script>
{% endblock %}

{% extends "network/layout.html" %}

{% block content %}
<style>
    .auth-card {
        background: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 24px;
        padding: 3rem;
        width: 100%;
        max-width: 500px;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        color: white;
        margin: 4rem auto;
        animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* Reuse some styles from login for consistency */
    @keyframes slideUp {
        from {
            opacity: 0;
            transform: translateY(30px);
        }

        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    .auth-title {
        font-weight: 800;
        font-size: 2.5rem;
        margin-bottom: 0.5rem;
        letter-spacing: -1px;
        background: linear-gradient(to bottom, #ffffff, #e2e8f0);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
    }

    .auth-subtitle {
        color: rgba(255, 255, 255, 0.7);
        margin-bottom: 2.5rem;
    }

    .auth-input-group {
        margin-bottom: 1.25rem;
    }

    .auth-input {
        width: 100%;
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.2);
        padding: 0.85rem 1.25rem;
        border-radius: 12px;
        color: white;
        transition: all 0.3s ease;
        outline: none;
    }

    .auth-input:focus {
        background: rgba(255, 255, 255, 0.15);
        border-color: rgba(255, 255, 255, 0.5);
        box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.1);
    }

    .auth-btn {
        width: 100%;
        background: white;
        color: #764ba2;
        border: none;
        padding: 1rem;
        border-radius: 12px;
        font-weight: 700;
        font-size: 1rem;
        cursor: pointer;
        transition: all 0.3s ease;
        margin-top: 1.5rem;
    }

    .auth-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 20px -5px rgba(0, 0, 0, 0.2);
    }

    .auth-footer {
        margin-top: 2rem;
        text-align: center;
        font-size: 0.9rem;
        color: rgba(255, 255, 255, 0.6);
    }

    .auth-footer a {
        color: white;
        font-weight: 600;
        text-decoration: none;
    }
</style>

<div class="auth-card">
    <div class="text-center">
        <h1 class="auth-title">Join Us.</h1>
        <p class="auth-subtitle">Create your account to start sharing</p>
    </div>

    {% if message %}
    <div class="alert alert-warning py-2 small border-0 rounded-lg text-center mb-4">
        {{ message }}
    </div>
    {% endif %}

    <form action="{% url 'network:register' %}" method="post">
        {% csrf_token %}

        <div class="auth-input-group">
            <input required class="auth-input" autofocus type="text" name="username" placeholder="Username">
        </div>

        <div class="auth-input-group">
            <input required class="auth-input" type="email" name="email" placeholder="Email Address">
        </div>

        <div class="auth-input-group">
            <input required class="auth-input" type="password" name="password" placeholder="Password">
        </div>

        <div class="auth-input-group">
            <input required class="auth-input" type="password" name="confirmation" placeholder="Confirm Password">
        </div>

        {{ form.as_p }}

        <button type="submit" class="auth-btn">
            Create Account <i class="fas fa-user-plus ml-2 opacity-50 h6 mb-0"></i>
        </button>
    </form>

    <div class="auth-footer">
        Already have an account? <a href="{% url 'login' %}">Log In</a>
    </div>
</div>
{% endblock %}

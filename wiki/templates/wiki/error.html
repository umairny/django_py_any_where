{% extends "wiki/layout.html" %}

{% block title %}Error - Wiki{% endblock %}

{% block wiki_content %}
<div class="glass-card wiki-card reveal text-center py-5">
    <div class="mb-4">
        <div class="display-1 font-weight-bold" style="color: var(--wiki-secondary); opacity: 0.2;">
            <i class="fas fa-exclamation-triangle"></i>
        </div>
        <h2 class="mt-3">Ouch! Something went wrong</h2>
        <p class="text-muted">{{ message }}</p>
    </div>

    <div class="mt-5 pt-4 border-top opacity-50">
        <a href="{% url 'wiki:index' %}" class="btn-wiki btn-wiki-primary">
            <i class="fas fa-home mr-1"></i> Back to Home
        </a>
        <button onclick="history.back()" class="btn-wiki btn-wiki-outline ml-3">
            <i class="fas fa-arrow-left mr-1"></i> Go Back
        </button>
    </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        setTimeout(() => {
            document.querySelector('.reveal').classList.add('reveal-active');
        }, 100);
    });
</script>
{% endblock %}
